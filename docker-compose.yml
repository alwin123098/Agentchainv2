version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agentchain_db
    environment:
      POSTGRES_USER: agentchain
      POSTGRES_PASSWORD: agentchain_dev
      POSTGRES_DB: agentchain_trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentchain"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentchain_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: agentchain_api
    environment:
      DATABASE_URL: postgresql://agentchain:agentchain_dev@postgres:5432/agentchain_trust
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key
      DEBUG: "true"
      API_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: python run.py

volumes:
  postgres_data:
  redis_data: